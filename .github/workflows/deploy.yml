# Builds the site on every push. Only main is deployed to GitHub Pages;
# other branches just prove that they build and pass the checks.
name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tell Bing (and other IndexNow engines) the pages changed. Bing's index also feeds
      # several AI assistants. The key file lives at the site root (public/<key>.txt).
      - name: Ping IndexNow
        env:
          SITE: https://ezzohamdan.github.io
          KEY: a89a1a5a2164b9a6ab6a5118c1ce31f4
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --arg host "${SITE#https://}" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}' \
          | curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
